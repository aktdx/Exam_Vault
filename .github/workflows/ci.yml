name: ExamVault CI

# 1. Trigger the workflow on pushes to main or any Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    # 2. Spin up a temporary PostgreSQL database for integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: examvault_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: examvault_test_db
        ports:
          - 5432:5432
        # Wait until Postgres is healthy before starting the job
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 3. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'       # Speeds up subsequent runs by caching dependencies

      # 5. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 6. Run TypeScript Build
      - name: Build Project
        run: npm run build

      # 7. Push Database Schema to create tables in the test DB
      - name: Push Database Schema
        run: npx drizzle-kit push
        env:
          SQL_HOST: localhost
          SQL_USER: examvault_test
          SQL_PASSWORD: testpassword
          SQL_DB_NAME: examvault_test_db
          DATABASE_URL: postgres://examvault_test:testpassword@localhost:5432/examvault_test_db

      # 8. Run the Test Suite
      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://examvault_test:testpassword@localhost:5432/examvault_test_db
          SQL_HOST: localhost
          SQL_USER: examvault_test
          SQL_PASSWORD: testpassword
          SQL_DB_NAME: examvault_test_db
          FIREBASE_PROJECT_ID: mock-project-id
          JWT_SECRET: super-secret-test-key

      # 9. Verify Docker Build
      - name: Build Docker Image
        run: docker build -t examvault:test .
